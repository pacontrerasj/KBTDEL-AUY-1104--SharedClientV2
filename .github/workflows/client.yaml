name: Deploy Canary — demo-api

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image-tag:
        description: Tag de la imagen a desplegar (ej. v1.0.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: pacontrerasj/KBTDEL-AUY-1104--SharedWorkflowsV2/.github/workflows/deploy-api.yaml@main

    with:
      image-name: demo-api
      image-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image-tag || github.ref_name }}
      k3s-server-public-ip: ${{ vars.K3S_SERVER_PUBLIC_IP }}
      k8s-namespace: ${{ vars.K8S_NAMESPACE || 'default' }}
      env-vars: ${{ vars.API_ENV_VARS || '' }}

    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      EA2_SSH_PRIVATE_KEY: ${{ secrets.EA2_SSH_PRIVATE_KEY }}